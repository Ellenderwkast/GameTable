services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gametable
      POSTGRES_USER: gametable
      POSTGRES_PASSWORD: gametable
    ports:
      - "5432:5432"
    volumes:
      - gametable-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametable -d gametable"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - gametable-redis:/data
volumes:
  gametable-postgres:
  gametable-redis: