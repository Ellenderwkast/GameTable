name: GameTable CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gametable
          POSTGRES_USER: gametable
          POSTGRES_PASSWORD: gametable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gametable -d gametable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gametable:gametable@localhost:5432/gametable?schema=public
      JWT_SECRET: ci-test-secret-at-least-thirty-two-characters-long
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy --workspace @gametable/api
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -f apps/api/Dockerfile -t gametable-api:ci .
